# Render Blueprint: static site for the WhatsFlow marketing website (Vite/React).
# Create as "Static Site" — NOT a Web Service.
services:
  - type: web
    name: micro-saas-website
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_PORTAL_URL
        value: https://micro-saas-portal.onrender.com
      - key: VITE_CONTACT_EMAIL
        sync: false
      - key: VITE_CONTACT_PHONE
        sync: false
      - key: VITE_WHATSAPP_NUMBER
        sync: false
    # SPA fallback — React Router client-side routes (/pricing, /features, …)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
