name: Deploy Website to DigitalOcean

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-website-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: |
          npm ci
          npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          command_timeout: 15m
          script: |
            chmod +x /var/www/autowave/micro-saas-website/scripts/deploy-digitalocean.sh
            APP_DIR=/var/www/autowave/micro-saas-website DEPLOY_BRANCH=${{ github.ref_name }} bash /var/www/autowave/micro-saas-website/scripts/deploy-digitalocean.sh
